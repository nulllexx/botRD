name: Test, build and deploy botRD

# Pushes: tests run on every branch; only main builds the image and deploys.
# Manual runs (Actions → "Run workflow"): test, build and deploy the chosen branch,
# or, with image_tag set, redeploy an image that was already built, without testing or building.
on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Redeploy an existing image instead of building: a full commit SHA, or 'latest'. Leave empty to build the chosen branch."
        required: false
        default: ""

# One deploy at a time; a newer run waits rather than racing the one in progress.
# Test-only runs (pushes to other branches) get their own group, so they never queue.
concurrency:
  group: ${{ (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && 'deploy' || format('test-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  test:
    if: inputs.image_tag == ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # The #[ignore]d test talks to Discord's live API, so it stays out of CI.
      - name: Tests
        run: cargo test --locked

  build-and-push:
    needs: test
    if: inputs.image_tag == '' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # GHCR image names must be lowercase; the repository name isn't.
      # Only main moves :latest, so a manual deploy of another branch never becomes the default image.
      - name: Image tags
        id: image
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "tags<<EOF"
            echo "$name:$GITHUB_SHA"
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then echo "$name:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    # Runs after a successful build, or on its own for a manual redeploy (build is skipped then).
    if: >-
      !cancelled() && (
        needs.build-and-push.result == 'success' ||
        (github.event_name == 'workflow_dispatch' && inputs.image_tag != '')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (for deploy/docker-compose.yml)
        uses: actions/checkout@v4

      # Deploy the exact commit's image rather than :latest, so what runs is what was built.
      # The input goes through env, never straight into the script, and must look like a tag.
      - name: Image to deploy
        id: image
        env:
          TAG: ${{ inputs.image_tag || github.sha }}
        run: |
          if ! [[ "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::'$TAG' is not a valid image tag"
            exit 1
          fi
          echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}:$TAG" >> "$GITHUB_OUTPUT"
          echo "Deploying ghcr.io/${GITHUB_REPOSITORY,,}:$TAG" >> "$GITHUB_STEP_SUMMARY"

      # scp-action runs its own `mkdir -p` and only reports "exit status 1" when that fails,
      # so create the folders here first, where a failure shows who we are and why.
      - name: Prepare deploy folder
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          port: 2222
          script: |
            if mkdir -p /home/useradmin/botrd/data; then exit 0; fi
            echo "::error::Could not create /home/useradmin/botrd as $(whoami). REMOTE_USER must be useradmin, or a user with write access to /home/useradmin."
            id
            ls -ld /home/useradmin /home/useradmin/botrd /home/useradmin/botrd/data 2>&1
            exit 1

      - name: Copy docker-compose.yml via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          port: 2222
          source: "deploy/docker-compose.yml"
          target: "/home/useradmin/botrd/"
          strip_components: 1

      - name: Deploy to Linux machine via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          BOTRD_IMAGE: ${{ steps.image.outputs.ref }}
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_SSH_KEY }}
          port: 2222
          envs: DISCORD_TOKEN,BOTRD_IMAGE
          script: |
            set -e
            mkdir -p /home/useradmin/botrd/data
            cd /home/useradmin/botrd/

            # An empty token would only make the bot exit on start and restart forever.
            if [ -z "$DISCORD_TOKEN" ]; then
              echo "::error::DISCORD_TOKEN secret is empty. Set it under Settings > Secrets and variables > Actions."
              exit 1
            fi

            # Durable, so a human running docker-compose here later resolves the same image and token.
            umask 077
            printf 'BOTRD_IMAGE=%s\nDISCORD_TOKEN=%s\n' "$BOTRD_IMAGE" "$DISCORD_TOKEN" > .env

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker-compose pull bot
            # Always a fresh container, so the log check below only sees this deploy's output.
            docker-compose up -d --force-recreate bot
            docker logout ghcr.io

            # The bot serves nothing to probe, so wait for it to log in to Discord instead.
            # Fail the deploy, with the logs, if it doesn't.
            for i in $(seq 1 30); do
              if docker logs botrd 2>&1 | grep -q '^Logged in as '; then
                docker logs botrd 2>&1 | grep '^Logged in as '
                echo "botRD is up"
                exit 0
              fi
              state="$(docker inspect -f '{{.State.Status}} {{.RestartCount}}' botrd)"
              case "$state" in
                "running 0") ;;
                *) echo "::error::botRD is not staying up (state: $state)"; docker logs --tail 50 botrd; exit 1 ;;
              esac
              sleep 1
            done
            echo "::error::botRD did not log in to Discord within 30s"
            docker logs --tail 50 botrd
            exit 1
